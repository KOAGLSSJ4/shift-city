# The "build robot": runs on David's laptop (a self-hosted GitHub runner, see unreal/BUILD-ROBOT.md).
# On every push that touches unreal/ it compiles the C++ and then runs the one-click setup script in the
# editor exactly as David would, and uploads the logs (and any crash report) so Claude can read them.
# Jobs wait in the queue until the laptop's runner is on.
name: Unreal build (David's laptop)
on:
  push:
    branches: [main]
    paths: ['unreal/**', '.github/workflows/unreal-build.yml']
  workflow_dispatch:
    inputs:
      run_script:
        description: Also run the setup script in the editor
        type: boolean
        default: true
concurrency:
  group: unreal-build
  cancel-in-progress: false # let a running build finish; newer pushes wait their turn
jobs:
  build:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 120
    env:
      UE_ROOT: ${{ vars.UE_ROOT || 'D:\Epic Games\UE_5.8' }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false # keep Binaries/Intermediate/downloads between runs so builds stay quick
          lfs: true # the Unreal assets (.uasset/.umap) live in Git LFS; without this they are placeholder files

      - name: Swap LFS placeholders for the real asset files
        # checkout only rewrites files that changed, so placeholders left by earlier runs stay unless we do this
        # the runner folder can be owned by another Windows user (e.g. made from an admin window), which makes
        # git refuse it ("Not in a Git repository"); trust it for this step only, without touching global config
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
        run: git lfs checkout

      - name: Copy the Fab packs (City Sample Vehicles etc.) from David's project
        # they are too big for GitHub, so they live only in David's own project folder; mirror them into this checkout
        shell: powershell
        env:
          SC_PROJECT: ${{ vars.SC_PROJECT || 'D:\Projects\Shift City\shift-city\unreal' }}
        run: |
          $src = Join-Path $env:SC_PROJECT "Content"
          $dst = Join-Path $env:GITHUB_WORKSPACE "unreal\Content"
          $packs = Get-ChildItem $src -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'CitySample*' -or $_.Name -eq 'Fab' }
          if (-not $packs) { "No Fab packs in $src (fine: the game falls back to the Shift City cars)" }
          foreach ($p in $packs) {
            "Copying $($p.Name)..."
            robocopy $p.FullName (Join-Path $dst $p.Name) /MIR /NFL /NDL /NJH /NP /R:1 /W:1 | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "robocopy failed for $($p.Name) ($LASTEXITCODE)" }
          }
          exit 0

      - name: Wait until Unreal is closed (it can't compile while an editor is open)
        shell: powershell
        timeout-minutes: 120
        run: |
          $warned = $false
          while (Get-Process -Name UnrealEditor, UnrealEditor-Cmd, LiveCodingConsole -ErrorAction SilentlyContinue) {
            if (-not $warned) { "Unreal Editor is open on this laptop: waiting for it to close before building..."; $warned = $true }
            Start-Sleep -Seconds 20
          }
          "No Unreal Editor running: building now"

      - name: Build the C++ (ShiftCityEditor, Development)
        id: build
        shell: cmd
        run: call "%UE_ROOT%\Engine\Build\BatchFiles\Build.bat" ShiftCityEditor Win64 Development -Project="%GITHUB_WORKSPACE%\unreal\ShiftCity.uproject" -WaitMutex

      - name: Run the setup script in the editor
        if: github.event_name == 'push' || inputs.run_script
        id: script
        continue-on-error: true # still try Play afterwards so we learn about both
        shell: powershell
        timeout-minutes: 60
        env:
          SHIFTCITY_CI: '1'
        run: |
          $proj = "$env:GITHUB_WORKSPACE\unreal\ShiftCity.uproject"
          $script = "$env:GITHUB_WORKSPACE\unreal\Scripts\setup_shift_city.py"
          $logFile = "$env:GITHUB_WORKSPACE\unreal\Saved\Logs\ShiftCity.log"
          Remove-Item $logFile -ErrorAction SilentlyContinue
          $editor = Start-Process -FilePath "$env:UE_ROOT\Engine\Binaries\Win64\UnrealEditor.exe" `
            -ArgumentList @("`"$proj`"", "-ExecutePythonScript=`"$script`"", "-unattended", "-nosplash") -PassThru -Wait
          "Editor exit code: $($editor.ExitCode)"
          if (-not (Test-Path $logFile)) { "No log written: the editor did not start"; exit 1 }
          # the interesting lines: our own [ShiftCity] messages plus anything that looks like trouble
          Get-Content $logFile | Select-String '\[ShiftCity\]|Error|Fatal|Assertion failed|Unhandled Exception|Crash' |
            Select-Object -Last 200 | ForEach-Object { $_.Line }
          if (Select-String -Path $logFile -Pattern 'SCRIPT FAILED|Fatal error|Unhandled Exception|Assertion failed' -Quiet) { exit 1 }
          if (-not (Select-String -Path $logFile -Pattern 'SCRIPT FINISHED' -Quiet)) { "The script never finished: the editor probably crashed (see the uploaded logs)"; exit 1 }

      - name: Play the level for 40 seconds (like pressing Play)
        if: always() && steps.build.outcome == 'success'
        shell: powershell
        timeout-minutes: 15
        run: |
          $proj = "$env:GITHUB_WORKSPACE\unreal\ShiftCity.uproject"
          $logFile = "$env:GITHUB_WORKSPACE\unreal\Saved\Logs\PlayTest.log"
          Remove-Item $logFile -ErrorAction SilentlyContinue
          Remove-Item "$env:GITHUB_WORKSPACE\unreal\Saved\RobotShots" -Recurse -ErrorAction SilentlyContinue
          $game = Start-Process -FilePath "$env:UE_ROOT\Engine\Binaries\Win64\UnrealEditor.exe" `
            -ArgumentList @("`"$proj`"", "/Game/ShiftCity/Maps/L_ShiftCity", "-game", "-windowed", "-ResX=1280", "-ResY=720", "-nosplash", "-unattended", "-SCShots", "-log=PlayTest.log") -PassThru
          $crashed = $false
          for ($i = 0; $i -lt 120; $i++) {   # up to ~2 min to load + 40 s of play
            Start-Sleep -Seconds 2
            if ($game.HasExited) { $crashed = $true; break }
            if ((Test-Path $logFile) -and (Select-String -Path $logFile -Pattern 'BeginPlay|Bringing up level for play|LogLoad: Took' -Quiet)) { break }
          }
          if (-not $crashed) {
            Start-Sleep -Seconds 55
            if ($game.HasExited) { $crashed = $true } else { Stop-Process -Id $game.Id -Force; "Played 55 s without crashing" }
          }
          if (Test-Path $logFile) {
            Get-Content $logFile | Select-String '\[ShiftCity\]|Error|Fatal|Assertion failed|Unhandled Exception|Crash' |
              Select-Object -Last 200 | ForEach-Object { $_.Line }
          }
          if ($crashed) { "THE GAME CRASHED OR QUIT DURING PLAY (exit code $($game.ExitCode))"; exit 1 }

      - name: Upload logs and crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unreal-logs
          path: |
            unreal/Saved/Logs/*.log
            unreal/Saved/Crashes/**
            unreal/Saved/RobotShots/**
          if-no-files-found: ignore

      - name: Mark the run failed if the setup script failed
        if: steps.script.outcome == 'failure'
        shell: powershell
        run: |
          "The setup script failed or crashed (see the 'Run the setup script' step and the unreal-logs artifact)"
          exit 1
